name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Build (iOS)
        run: xcodebuild -scheme ZoomSlider -destination 'generic/platform=iOS' build
      - name: Build demo (iOS)
        run: xcodebuild -scheme ZoomSliderDemo -destination 'generic/platform=iOS' build
